[project]
name = "sarthi"
version = "0.1.0"
description = "VAYU-SARTHI: AI decision support for dynamic air operations and resource optimisation"
requires-python = ">=3.11"
dependencies = [
    "ortools>=9.12",
    "numpy>=1.26",
    "scipy>=1.11",
    "pydantic>=2.6",
]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn>=0.29"]
dev = ["pytest>=8", "httpx>=0.27"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["sarthi"]

[tool.setuptools.package-data]
sarthi = ["data/*.json", "data/met/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
